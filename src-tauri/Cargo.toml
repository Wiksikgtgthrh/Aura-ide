[package]
name = "aura-ide"
version = "1.0.0"
description = "Aura IDE — оптимизированная desktop AI-среда разработки"
authors = ["Aura"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aura_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
portpicker = "0.1"
hostname = "0.4"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["rustls-tls", "json", "stream"]

[profile.release]
# Максимально лёгкий и быстрый релизный бинарник.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
