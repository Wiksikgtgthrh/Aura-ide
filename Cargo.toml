[workspace]
resolver = "2"
members = ["crates/aura-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aura IDE team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Domain
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
notify = "6"
directories = "5"
walkdir = "2"

# Tauri layer
tauri = { version = "2", features = [] }
tauri-build = { version = "2" }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc", features = ["derive"] }
specta-typescript = "0.0.7"
portable-pty = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
